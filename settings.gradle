pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = "Werewolves"

include(
        ':werewolves-api',
        ':werewolves'
)

project(':werewolves-api').projectDir = file("projects/werewolves-api")
project(':werewolves').projectDir = file("projects/werewolves")

// Optional: develop against a local checkout of the FactionApi/Vampirism project instead of the published artifacts.
// Enable by setting `vampirism_local_path=/path/to/Vampirism` in ~/.gradle/gradle.properties or via -Pvampirism_local_path=...
def vampirismLocalPath = providers.gradleProperty('vampirism_local_path').orNull
if (vampirismLocalPath) {
    includeBuild(vampirismLocalPath) {
        dependencySubstitution {
            substitute module('de.teamlapen.faction:FactionApi-api') using project(':faction-api')
            substitute module('de.teamlapen.faction:FactionApi') using project(':faction')
            substitute module('de.teamlapen.vampirism:Vampirism-api') using project(':vampirism-api')
            substitute module('de.teamlapen.vampirism:Vampirism') using project(':vampirism')
        }
    }
}