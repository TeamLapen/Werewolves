pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = "Werewolves"

include(
        ':werewolves-api',
        ':werewolves'
)

project(':werewolves-api').projectDir = file("projects/werewolves-api")
project(':werewolves').projectDir = file("projects/werewolves")