name: publish.yml
on:
  push:
    tags:
      - '*-alpha.*'
      - '*-dev.*'
      - '*-test.*'
  release:
    types:
      - released
      - prereleased

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      mc_version: ${{ steps.extract.outputs.mc_version }}
      mod_version: ${{ steps.extract.outputs.mod_version }}
      environment: ${{ steps.extract.outputs.environment }}
      run_publish: ${{ steps.extract.outputs.run_publish }}
      registry: ${{ steps.extract.outputs.registry }}
    steps:
      - name: Extract mod version from tag
        id: extract
        run: |
          if [[ ! $GITHUB_REF_NAME =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?-[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|dev|test)\.[a-zA-Z0-9.]+)?$ ]]; then
            echo "::error::Invalid tag format: $GITHUB_REF_NAME. Expected <mc-version>-<mod-version>[-<status>.<identifier>]"
            exit 1
          fi
          version="$GITHUB_REF_NAME"
          echo "mc_version=${version%%-*}" >> $GITHUB_OUTPUT
          echo "mod_version=${version}" >> $GITHUB_OUTPUT
          if [[ $version =~ -(alpha|beta)\. ]]; then
            echo "environment=release" >> $GITHUB_OUTPUT
            echo "run_publish=true" >> $GITHUB_OUTPUT
            echo "registry=snapshots" >> $GITHUB_OUTPUT
          elif [[ $version =~ -(dev|test)\. ]]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "run_publish=false" >> $GITHUB_OUTPUT
            echo "registry=snapshots" >> $GITHUB_OUTPUT
          else
            echo "environment=release" >> $GITHUB_OUTPUT
            echo "run_publish=true" >> $GITHUB_OUTPUT
            echo "registry=releases" >> $GITHUB_OUTPUT
          fi

  build:
    needs: [ prepare ]
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.environment }}
    env:
      ORG_GRADLE_PROJECT_werewolves_version: ${{ needs.prepare.outputs.mod_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Setup Gradle
        run: ./gradlew
      - name: Build API
        run: ./gradlew werewolves-api:build
      - name: Build Mod
        run: ./gradlew werewolves:build
      - name: Upload Jars
        uses: actions/upload-artifact@v6
        with:
          name: werewolves-jars
          path: |
            projects/werewolves/build/libs/*.jar
            projects/werewolves-api/build/libs/*.jar
          retention-days: 2

  publish-maven:
    needs: [ prepare, build ]
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.environment }}
    env:
      ORG_GRADLE_PROJECT_werewolves_version: ${{ needs.prepare.outputs.mod_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Get Artifacts
        uses: actions/download-artifact@v8
        with:
          name: werewolves-jars
          path: projects/
      - name: Setup Gradle
        run: ./gradlew
      - name: Select Maven Repository
        run: |
          if [[ ${{ needs.prepare.outputs.registry }} == 'snapshots' ]]; then
            echo "MAVEN_URL=${{ secrets.MAVEN_URL_SNAPSHOTS }}" >> "$GITHUB_ENV"
          elif [[ ${{ needs.prepare.outputs.registry }} == 'releases' ]]; then
            echo "MAVEN_URL=${{ secrets.MAVEN_URL_RELEASES }}" >> "$GITHUB_ENV"
          fi
      - name: Publish to Maven
        run: ./gradlew werewolves-api:publish werewolves:publish
        env:
          MAVEN_URL: ${{ env.MAVEN_URL }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

  publish-mods:
    needs: [ prepare, build, publish-maven ]
    environment: ${{ needs.prepare.outputs.environment }}
    if: ${{ needs.prepare.outputs.run_publish == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Get Artifacts
        uses: actions/download-artifact@v8
        with:
          name: werewolves-jars
          path: projects/
      - name: Publish
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: projects/werewolves/build/libs/Werewolves-${{ needs.prepare.outputs.mod_version }}.jar
          name: Werewolves ${{ needs.prepare.outputs.mod_version }}
          version: ${{ needs.prepare.outputs.mod_version }}
          version-type: ${{ contains(needs.prepare.outputs.mod_version, 'alpha') && 'alpha' || contains(needs.prepare.outputs.mod_version, 'beta') && 'beta' || 'release' }}
          changelog: ${{ github.event.release.body }}
          game-versions: |
            ${{ needs.prepare.outputs.mc_version }}
          loaders: |
            neoforge
