name: Gradle Build

on:
  push:
    branches:
      - 'dev'
      - 'feature/*'
      - 'version/*'
  pull_request:
    branches:
      - 'dev'
      - 'feature/*'
      - 'version/*'
      - 'translate/*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Setup Gradle
        run: ./gradlew
      - name: Build API
        run: ./gradlew werewolves-api:build
      - name: Build Mod
        run: ./gradlew werewolves:build
