tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.ALL
}

ext.registerJarFiles = { List<String> filePaths ->
    tasks.withType(Jar).configureEach {
        filePaths.each { path ->
            from(rootProject.file(path))
        }
    }
}

if (!project.hasProperty("werewolves_version")) {
    var tmpVersion = project.minecraft_version + "-" + project.werewolves_mod_version
    if (project.hasProperty("werewolves_test_id")) {
        tmpVersion += "-test." + project.property("werewolves_test_id")
    }
    allprojects {
        ext.werewolves_version = tmpVersion
    }
}

subprojects {
    apply plugin: 'eclipse'
    apply plugin: 'maven-publish'
    apply from: rootProject.file('gradle/idea.gradle')

    afterEvaluate {
        def mavenUrl = System.getenv("MAVEN_URL")
        if (mavenUrl) {
            publishing {
                repositories {
                    maven {
                        url = mavenUrl
                        credentials {
                            username = System.getenv("MAVEN_USERNAME") ?: ""
                            password = System.getenv("MAVEN_PASSWORD") ?: ""
                        }
                    }
                }
            }
        }
    }
}